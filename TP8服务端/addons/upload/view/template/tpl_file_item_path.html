<script id="tpl-file-item" type="text/template">
    {{ each list }}
    <div class="file-item">
        <a href="{{ $value.url }}" title="点击查看大图" target="_blank">
            <img src="{{ $value.url }}">
        </a>
        <input type="hidden" name="{{ name }}" value="{{ $value.file_path }}">
        <i class="iconfont iconshanchu file-item-delete"></i>
    </div>
    {{ /each }}
</script>
