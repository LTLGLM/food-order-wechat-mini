<div class="row-content am-cf">
    <div class="row">
        <div class="am-u-sm-12 am-u-md-12 am-u-lg-12">
            <div class="widget am-cf">
                <form id="my-form" class="am-form tpl-form-line-form" method="post">
                    <div class="widget-body">
                        <fieldset>
                            <div class="widget-head am-cf">
                                <div class="widget-title am-fl">添加优惠券</div>
                            </div>
                            <div class="am-form-group">
                                <label class="am-u-sm-3 am-u-lg-2 am-form-label form-require">优惠券名称 </label>
                                <div class="am-u-sm-9 am-u-end">
                                    <input type="text" class="tpl-form-input" name="data[name]" value="" required>
                                </div>
                            </div>
                            <div class="am-form-group">
                                <label class="am-u-sm-3 am-u-lg-2 am-form-label form-require">有效天数 </label>
                                <div class="am-u-sm-9 am-u-end">
                                    <input type="number" class="tpl-form-input" name="data[initial_days]" value="30"  min="1" required>
                                    <small>自发券当天起，多少天有效。目前仅作用在自动发券的场景中，如充值送券。</small>
                                </div>
                            </div>
                            <div class="am-form-group">
                                <label class="am-u-sm-3 am-u-lg-2 am-form-label form-require">使用数量 </label>
                                <div class="am-u-sm-9 am-u-end">
                                    <input type="number" class="tpl-form-input" name="data[use_amount]" value="0"  min="0" required>
                                    <small>每天可使用该券的数量。设置0为不限制，如设置5则每天最多使用5张</small>
                                </div>
                            </div>
                            <div class="am-form-group">
                                <label class="am-u-sm-3 am-u-lg-2 am-form-label form-require">优惠券类型</label>
                                <div class="am-u-sm-9 am-u-end">
                                    <label class="am-radio-inline">
                                        <input @click="check()" type="radio" v-model="type" name="data[type]" value="10" data-am-ucheck> 现金券
                                    </label>
                                    <label class="am-radio-inline">
                                        <input type="radio" @click="check()" v-model="type" name="data[type]" value="20" data-am-ucheck> 折扣券
                                    </label>
                                    <label class="am-radio-inline">
                                        <input type="radio" @click="check()" v-model="type" name="data[type]" value="30" data-am-ucheck> 赠送券
                                    </label>
                                    <label class="am-radio-inline">
                                        <input type="radio" @click="check()" v-model="type" name="data[type]" value="40" data-am-ucheck> 单品券
                                    </label>
                                </div>
                            </div>
                            <div class="am-form-group">
                                <label class="am-u-sm-3 am-u-lg-2 am-form-label form-require">规则条件</label>
                                <div class="am-u-sm-9 am-u-end">
                                    <input type="number" name="data[order_price]" min="0" value="0" required>
                                    <small>订单金额满多少可以使用，设置0为不限制金额</small>
                                </div>
                            </div>
                            <div v-if="type==40">
                            <div class="am-form-group">
                                <label class="am-u-sm-3  am-u-lg-2 am-form-label form-require"> 指定商品 </label>
                                <div class="am-u-sm-9 am-u-end">
                                    <div class="widget-become-goods am-form-file am-margin-top-xs">
                                        <button @click="goods()" type="button"
                                                class="upload-file am-btn am-btn-secondary am-radius">
                                            <i class="am-icon-cloud-upload"></i> 选择商品
                                        </button>
                                        <div class="coupon-list uploader-list am-cf">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            </div>
                            <div v-if="type==30">
                            <div class="am-form-group">
                                <label class="am-u-sm-3  am-u-lg-2 am-form-label form-require"> 指定赠品 </label>
                                <div class="am-u-sm-9 am-u-end">
                                    <div class="widget-become-goods am-form-file am-margin-top-xs">
                                        <button @click="coupon()" type="button"
                                                class="upload-file am-btn am-btn-secondary am-radius">
                                            <i class="am-icon-cloud-upload"></i> 选择优惠券
                                        </button>
                                        <button @click="goods()" type="button"
                                                class="upload-file am-btn am-btn-secondary am-radius">
                                            <i class="am-icon-cloud-upload"></i> 选择商品
                                        </button>
                                        <div class="coupon-list uploader-list am-cf">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            </div>
                            <div v-else class="am-form-group">
                                <label class="am-u-sm-3 am-u-lg-2 am-form-label form-require">优惠参数</label>
                                <div class="am-u-sm-9 am-u-end">
                                    <input type="number" name="data[values]" min="1" value="" required>
                                    <small>当优惠券类型为现金券时单位为元。为折扣券、单品券时单位为百分比，取值1-100，当设置90时为9折优惠。</small>
                                </div>
                            </div>
                            <div class="am-form-group">
                                <label class="am-u-sm-3 am-u-lg-2 am-form-label form-require">规则说明 </label>
                                <div class="am-u-sm-9 am-u-end">
                                    <input type="text" class="tpl-form-input" name="data[explain]"
                                           value="" required>
                                </div>
                            </div>
                            <!-- 表单提交按钮 -->
                            <div class="am-form-group">
                                <div class="am-u-sm-9 am-u-sm-push-3 am-margin-top-lg">
                                    <button type="submit" class="j-submit am-btn am-btn-secondary">提交
                                    </button>
                                </div>
                            </div>
                        </fieldset>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{include file="market/coupon/tpl_gift" /}
<script src="/assets/plugins/vue/vue.min.js?v={$version}"></script>
<script src="/assets/js/select.data.js?v={$version}"></script>
<script>
    // 渲染页面
    new Vue({
        el: '#my-form',
        data: {
            type: 10,
        },
        methods:{
            check(){
                var $userList = $('.coupon-list');
                $userList.html(template('tpl-coupon-item', {}));
            },
            coupon(){
                var $userList = $('.coupon-list');
                $.selectData({
                    title: '选择优惠券',
                    uri: 'coupon/lists',
                    dataIndex: 'coupon_id',
                    done: function (data) {
                        $userList.html(template('tpl-coupon-item', data));
                    }
                });
            },
            goods(){
                var $userList = $('.coupon-list');
                $.selectData({
                    title: '选择商品',
                    uri: 'goods/lists',
                    dataIndex: 'goods_id',
                    done: function (data) {
                        var coupon = [data[0]];//只选取第一个
                        $userList.html(template('tpl-coupon-item', coupon));
                    }
                });
            }
        }
    });
    $(function () {
        /**
         * 表单验证提交
         */
        $('#my-form').formPost();
    });
</script>
