<!-- 编辑 -->
<script id="tpl-edit" type="text/template">
    <div class="am-padding-xs am-padding-top-sm">
        <div class="am-form-group">
            <label class="am-u-sm-3 am-u-lg-2 am-form-label form-require">服务评分 </label>
            <div class="am-u-sm-9 am-u-end">
                <input type="number" min="1" max="5" class="tpl-form-input" name="data[serve]" value="{{ model.serve }}" required>
				<small>最小值1，最大5</small>
            </div>
        </div>
		<div class="am-form-group">
            <label class="am-u-sm-3 am-u-lg-2 am-form-label form-require">速度评分 </label>
            <div class="am-u-sm-9 am-u-end">
                <input type="number" min="1" max="5" class="tpl-form-input" name="data[speed]" value="{{ model.speed }}" required>
				<small>最小值1，最大5</small>
            </div>
        </div>
		<div class="am-form-group">
            <label class="am-u-sm-3 am-u-lg-2 am-form-label form-require">口味评分 </label>
            <div class="am-u-sm-9 am-u-end">
                <input type="number" min="1" max="5" class="tpl-form-input" name="data[flavor]" value="{{ model.flavor }}" required>
				<small>最小值1，最大5</small>
            </div>
        </div>
		<div class="am-form-group">
            <label class="am-u-sm-3 am-u-lg-2 am-form-label form-require">环境评分 </label>
            <div class="am-u-sm-9 am-u-end">
                <input type="number" min="1" max="5" class="tpl-form-input" name="data[ambient]" value="{{ model.ambient }}" required>
				<small>最小值1，最大5</small>
            </div>
        </div>
		<div class="am-form-group">
            <label class="am-u-sm-3 am-u-lg-2 am-form-label form-require">评论内容 </label>
            <div class="am-u-sm-9 am-u-end">
                <textarea rows="3" placeholder="请输入评论内容" name="data[content]">{{ model.content }}</textarea>
            </div>
        </div>
		<div class="am-form-group">
            <label class="am-u-sm-3 am-u-lg-2 am-form-label">回复内容 </label>
            <div class="am-u-sm-9 am-u-end">
                <textarea rows="3" placeholder="请输入回复内容" name="data[reply]">{{ model.reply }}</textarea>
            </div>
        </div>
        <div class="am-form-group">
            <label class="am-u-sm-3 am-u-lg-2 am-form-label form-require">是否显示 </label>
            <div class="am-u-sm-9 am-u-end">
                <label class="am-radio-inline">
                    <input type="radio" name="data[is_show]" value="1" data-am-ucheck {{ model.is_show.value == 1 ? 'checked' : '' }}>
                    是
                </label>
                <label class="am-radio-inline">
                    <input type="radio" name="data[is_show]" value="0" data-am-ucheck {{ model.is_show.value == 0 ? 'checked' : '' }}>
                    否
                </label>
            </div>
        </div>
    </div>   
</script>
