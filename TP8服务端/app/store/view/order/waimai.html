<!-- 模板：外卖配送 -->
<script id="tpl-waimai" type="text/template">
    <div class="am-padding-xs am-padding-top-sm">
        <div class="am-form-group">
            <label class="am-u-sm-2 am-form-label form-require">配送方式</label>
            <div class="am-u-sm-10 am-u-end">
                <label class="am-radio-inline">
                    <input type="radio" name="data[company]" value="self" data-am-ucheck checked required>
                    商家自配
                </label>
                {{each company}}
                <label class="am-radio-inline">
                    <input type="radio" name="data[company]" value="{{ $value.name }}" data-am-ucheck required>
                     {{ $value.title }}
                </label>
                {{/each}}
            </div>
        </div>
        <div class="am-form-group is-clerk">
            <label class="am-u-sm-2 am-form-label form-require">配送员</label>
            <div class="am-u-sm-10 am-u-end">
                <select name="data[shop_clerk_id]" style="width:200px;" required>
                    <option value="">请选择配送员</option>
                    {{each clerk}}
                    <option value="{{ $value.shop_clerk_id }}">{{ $value.linkman }}</option>
                    {{/each}}
                </select>
            </div>
        </div>
    </div> 
</script>
