<!DOCTYPE html><html>	<head>		<meta charset="utf-8">		<meta content="IE=edge" http-equiv="X-UA-Compatible">		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">		<title>门店登录 - {$base['name']}</title>		<meta name="author" content="{$base['name']}">		<link rel="icon" type="image/png" href="/favicon.png" />		<link rel="stylesheet" href="/assets/css/hema.login.css?v={$version}" />		<link rel="stylesheet" href="/assets/plugins/amazeui/amazeui.css?v={$version}" />		<script src="/assets/plugins/jquery/jquery.min.js?v={$version}"></script>		<script>			STORE_URL = '{:isset($store_url) ? $store_url : ''}';		</script>	</head>	<body>		<div class="container">		    <div class="login-in">    			<div class="form">    			    <div class="title">门店登录</div>    				<form id="my-form">						<div class="input">							<i class="am-icon-user"></i>							<input type="text" name="data[phone]" value="" placeholder="请输入账号" required>						</div>						<div class="input">							<i class="am-icon-lock"></i>							<input type="password" name="data[password]" value="" placeholder="请输入密码" required>						</div>						<div style="padding:20px 0px;">							<div class="w50">								<i class="am-icon-shield"></i>								<input type="text" name="data[captcha]" value="" placeholder="请输入验证码" required>							</div>							<div class="captcha">                                <img id="validCode" src="{:url('passport/captcha')}" alt="验证码" onclick="this.src='{:url('passport/captcha')}?'+Math.random()" />                            </div>                        </div>                        <div class="sub-btn">						    <button class="j-submit am-btn am-btn-primary am-btn-lg am-radius" type="submit">登录</button>						</div>					</form>    			</div>    			<div class="version">V{$version}</div>    		</div>		</div>	</body>	<script>		$(function() {			$('#my-form').formPost();		});	</script>	<script src="/assets/plugins/layer/layer.js?v={$version}"></script>	<script src="/assets/plugins/jquery/jquery.form.min.js?v={$version}"></script>	<script src="/assets/plugins/amazeui/amazeui.min.js?v={$version}"></script>	<script src="/assets/js/hema.app.js?v={$version}"></script></html>
