<div class="row-content am-cf">    <div class="row">        <div class="am-u-sm-12 am-u-md-12 am-u-lg-12">            <div class="widget am-cf">                <form id="my-form" class="am-form tpl-form-line-form" method="post">                    <div class="widget-body">                        <fieldset>                            <div class="widget-head am-cf">                                <div class="widget-title am-fl">基本设置</div>                            </div>                            <div class="am-form-group">                                <label class="am-u-sm-3 am-u-lg-2 am-form-label form-require">                                    <span class="tpl-form-line-small-title">APP_ID</span>                                </label>                                <div class="am-u-sm-9 am-u-end">                                    <input type="text" class="tpl-form-input" name="data[app_id]"									value="{$model['app_id']}" placeholder="请输入公众号APP_ID" required>                                </div>                            </div>                            <div class="am-form-group">                                <label class="am-u-sm-3 am-u-lg-2 am-form-label form-require">                                    <span class="tpl-form-line-small-title">APP_SECRET</span>                                </label>                                <div class="am-u-sm-9 am-u-end">                                    <input type="text" class="tpl-form-input" name="data[app_secret]"									value="{$model['app_secret']}" placeholder="请输入公众号Secret密钥" required>                                </div>                            </div>                            <div class="widget-head am-cf">                                <div class="widget-title am-fl">服务器配置</div>                            </div>                            <div class="am-form-group">                                <label class="am-u-sm-3 am-u-lg-2 am-form-label form-require">                                    服务器地址<span class="tpl-form-line-small-title">URL</span>                                </label>                                <div class="am-u-sm-9 am-u-end">                                    <input type="hidden" name="data[url]" value="{$model['url']}">                                    <input type="text" class="tpl-form-input" value="{$model['url']}" disabled>									<small>固定不变，公众平台配置于此保持一致</small>                                </div>                            </div>                            <div class="am-form-group">                                <label class="am-u-sm-3 am-u-lg-2 am-form-label form-require">                                    令牌<span class="tpl-form-line-small-title">Token</span>                                </label>                                <div class="am-u-sm-9 am-u-end">                                    <input type="text" class="tpl-form-input" name="data[token]"									value="{$model['token']}"  placeholder="请输入Token令牌" required>                                </div>                            </div>                            <div class="am-form-group">                                <label class="am-u-sm-3 am-u-lg-2 am-form-label form-require">                                    加解密密钥<span class="tpl-form-line-small-title">KEY</span>                                </label>                                <div class="am-u-sm-9 am-u-end">                                    <input type="text" class="tpl-form-input" name="data[encoding_aes_key]"									value="{$model['encoding_aes_key']}" placeholder="请输入加解密密钥KEY" required>                                </div>                            </div>                            <div class="am-form-group">                                <div class="am-u-sm-9 am-u-sm-push-3 am-margin-top-lg">                                    <button type="submit" class="j-submit am-btn am-btn-secondary">提交</button>                                </div>                            </div>                        </fieldset>                    </div>                </form>            </div>        </div>    </div></div><script>    $(function () {        $('#my-form').formPost();    });</script>
