<!-- 添加 --><script id="tpl-add" type="text/template">    <div class="am-padding-xs am-padding-top-sm">        <div class="am-form-group">            <label class="am-u-sm-3 am-u-lg-2 am-form-label form-require">关键字 </label>            <div class="am-u-sm-9 am-u-end">                <input type="text" class="tpl-form-input" name="data[keyword]" value="" required>                <small>关键字设置为 * ，为无效关键字的回复</small>            </div>        </div>        <div class="am-form-group">            <label class="am-u-sm-3 am-u-lg-2 am-form-label form-require">消息类型 </label>            <div class="am-u-sm-9 am-u-end">                <select class="type" name="data[type]" style="width:150px;" required>                    <option value="">请选择消息类型</option>                    <option value="text">文字消息</option>                    <option value="image">图片消息</option>                    <option value="voice">语音消息</option>					<option value="video">视频消息</option>					<option value="news">图文消息</option>                </select>            </div>        </div>        <div class="key-content">            <div class="am-form-group key-text">                <label class="am-u-sm-3 am-u-lg-2 am-form-label form-require">回复内容 </label>                <div class="am-u-sm-9 am-u-end">                    <textarea name="data[content][text]" rows="5" placeholder="请输入回复内容" required></textarea>					<small>换行显示用“回车”</small>                </div>            </div>            <div class="am-form-group key-media-id">                <label class="am-u-sm-3 am-u-lg-2 am-form-label form-require">MEDIA_ID </label>                <div class="am-u-sm-9 am-u-end">                    <input type="text" class="tpl-form-input" name="data[content][media_id]" value="" required>                    <small class="key-image"><a href="{:url('plat.weixin.wechat.material.image/index')}">点此上传图片素材，或获取 MEDIA_ID</a></small>                    <small class="key-voice"><a href="{:url('plat.weixin.wechat.material.voice/index')}">点此上传语音素材，或获取 MEDIA_ID</a></small>                    <small class="key-video"><a href="{:url('plat.weixin.wechat.material.video/index')}">点此上传视频素材，或获取 MEDIA_ID</a></small>                    <small class="key-news"><a href="{:url('plat.weixin.wechat.material.text/index')}">点此上传图文素材，或获取 MEDIA_ID</a></small>                </div>            </div>	        </div>        <div class="am-form-group">            <label class="am-u-sm-3 am-u-lg-2 am-form-label form-require">是否开启 </label>            <div class="am-u-sm-9 am-u-end">                <label class="am-radio-inline">                    <input type="radio" name="data[is_open]" value="1" data-am-ucheck checked>                    开启                </label>                <label class="am-radio-inline">                    <input type="radio" name="data[is_open]" value="0" data-am-ucheck>                    关闭                </label>            </div>        </div>    </div>  </script>
