<div class="row-content am-cf">    <div class="row">        <div class="am-u-sm-12 am-u-md-12 am-u-lg-12">            <div class="widget am-cf">                <form id="my-form" class="am-form tpl-form-line-form" enctype="multipart/form-data" method="post">                    <div class="widget-head am-cf">                        <div class="widget-title am-fl">微信小程序订阅消息设置</div>                    </div>                    <div class="tips am-margin-bottom-sm am-u-sm-12">                        <div class="pre-warning">微信小程序必须添加“商业服务-软件/建站/技术开发”服务类目后，直接点击下列按钮同步即可</div>                    </div>                    <div class="widget-body">                        <fieldset>                            <div class="am-form-group">                                <label class="am-u-sm-3 am-u-lg-2 am-form-label">商家接单通知 </label>                                <div class="am-u-sm-4 am-u-end">                                    <input type="text" class="tpl-form-input" value="{$model['receive']}" disabled>                                    <input type="hidden" name="data['receive']">                                </div>                            </div>                            <div class="am-form-group">                                <label class="am-u-sm-3 am-u-lg-2 am-form-label">骑手接单通知 </label>                                <div class="am-u-sm-4 am-u-end">                                    <input type="text" class="tpl-form-input" value="{$model['horseman']}" disabled>                                    <input type="hidden" name="data['horseman']">                                </div>                            </div>                            <div class="am-form-group">                                <label class="am-u-sm-3 am-u-lg-2 am-form-label">订单配送通知 </label>                                <div class="am-u-sm-4 am-u-end">                                    <input type="text" class="tpl-form-input" value="{$model['delivery']}" disabled>                                    <input type="hidden" name="data['delivery']">                                </div>                            </div>							<div class="am-form-group">                                <label class="am-u-sm-3 am-u-lg-2 am-form-label">取货提醒 </label>                                <div class="am-u-sm-4 am-u-end">                                    <input type="text" class="tpl-form-input" value="{$model['take']}" disabled>                                    <input type="hidden" name="data['take']">                                </div>                            </div>							<div class="am-form-group">                                <label class="am-u-sm-3 am-u-lg-2 am-form-label">退款状态通知 </label>                                <div class="am-u-sm-4 am-u-end">                                    <input type="text" class="tpl-form-input" value="{$model['refund']}" disabled>                                    <input type="hidden" name="data['refund']">                                </div>                            </div>                            <div class="am-form-group">                                <label class="am-u-sm-3 am-u-lg-2 am-form-label">预约状态通知 </label>                                <div class="am-u-sm-4 am-u-end">                                    <input type="text" class="tpl-form-input" value="{$model['pact_status']}" disabled>                                    <input type="hidden" name="data['pact_status']">                                </div>                            </div>							<!-- 事件功能 -->							<div class="am-modal am-modal-loading am-modal-no-btn" tabindex="-1" id="my-modal-loading"></div>                            <div class="am-form-group">                                <div class="am-u-sm-9 am-u-sm-push-3 am-margin-top-lg">                                    <button type="submit" class="j-submit am-btn am-btn-secondary">一键同步                                    </button>                                </div>                            </div>                        </fieldset>                    </div>                </form>            </div>        </div>    </div></div><script>    $(function () {        $('#my-form').formPost();    });</script>
