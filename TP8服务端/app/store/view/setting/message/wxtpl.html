<div class="row-content am-cf">    <div class="row">        <div class="am-u-sm-12 am-u-md-12 am-u-lg-12">            <div class="widget am-cf">                <form id="my-form" class="am-form tpl-form-line-form" enctype="multipart/form-data" method="post">                    <div class="widget-body">                        <fieldset>                            <div class="widget-head am-cf">                                <div class="widget-title am-fl">商户提醒</div>                            </div>                            <div class="am-form-group">                                <label class="am-u-sm-3 am-u-lg-2 am-form-label">注册成功通知 </label>                                <div class="am-u-sm-9 am-u-end">                                    <input type="text" class="tpl-form-input" name="data[register_success]" value="{$model['register_success']}">                                </div>                            </div>                            <div class="am-form-group">                                <label class="am-u-sm-3 am-u-lg-2 am-form-label">新订单通知 </label>                                <div class="am-u-sm-9 am-u-end">                                    <input type="text" class="tpl-form-input" name="data[news_order]" value="{$model['news_order']}">                                </div>                            </div>                            <div class="am-form-group">                                <label class="am-u-sm-3 am-u-lg-2 am-form-label">用户申请退款通知 </label>                                <div class="am-u-sm-9 am-u-end">                                    <input type="text" class="tpl-form-input" name="data[apply_refund]" value="{$model['apply_refund']}">                                </div>                            </div>                            <div class="am-form-group">                                <label class="am-u-sm-3 am-u-lg-2 am-form-label">提现到账通知 </label>                                <div class="am-u-sm-9 am-u-end">                                    <input type="text" class="tpl-form-input" name="data[cash_account]" value="{$model['cash_account']}">                                </div>                            </div>                            <div class="widget-head am-cf">                                <div class="widget-title am-fl">管理提醒</div>                            </div>                            <div class="am-form-group">                                <label class="am-u-sm-3 am-u-lg-2 am-form-label">提现申请通知 </label>                                <div class="am-u-sm-9 am-u-end">                                    <input type="text" class="tpl-form-input" name="data[apply_cash]" value="{$model['apply_cash']}">                                </div>                            </div>							<!-- 事件功能 -->							<div class="am-modal am-modal-loading am-modal-no-btn" tabindex="-1" id="my-modal-loading"></div>                            <div class="am-form-group">                                <div class="am-u-sm-9 am-u-sm-push-3 am-margin-top-lg">                                    <button type="submit" class="j-submit am-btn am-btn-secondary">提交保存                                    </button>                                </div>                            </div>                        </fieldset>                    </div>                </form>            </div>        </div>    </div></div><script>    $(function () {        $('#my-form').formPost();    });</script>
